name: Python CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest

      - name: Build Docker image
        run: |
          docker build -t ci-cd-demo .


  docker:

    needs: test

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io\${{ github.repository_owner }}/ci-cd-demo:latest .

      - name: Push Docker image
        run: |
          docker push \
            ghcr.io\${{ github.repository_owner }}/ci-cd-demo:latest


  deploy:

    needs: docker

    runs-on: ubuntu-latest

    steps:

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ghcr.io\${{ github.repository_owner }}/ci-cd-demo:latest

            docker stop ci-cd-demo || true

            docker rm ci-cd-demo || true

            docker run -d \
              --name ci-cd-demo \
              -p 80:5000 \
              ghcr.io\${{ github.repository_owner }}/ci-cd-demo:latest